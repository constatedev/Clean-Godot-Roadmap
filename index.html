  <meta name="description" content="Clean Godot Roadmap — интерактивный путь изучения Godot: 34 раздела, 209 тем, задания, ресурсы и локальный прогресс.">
  <meta name="theme-color" content="#0e1117">
  <title>Clean Godot Roadmap</title>
  <script>try { document.documentElement.classList.toggle('dark', JSON.parse(localStorage.getItem('clean-godot-roadmap:v1') || '{}').theme !== 'light'); } catch (_) {}</script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
    @theme { --font-sans: "Inter", "Segoe UI", system-ui, sans-serif; }
  </style>
  <style>
    :root { color-scheme:light; --bg:#f4f6f8; --panel:#fff; --line:#e0e5eb; --text:#16202e; --muted:#5d6b7d; --accent:#087a6e; }
    .dark { color-scheme:dark; --bg:#0e1117; --panel:#151a23; --line:#29323f; --text:#e9eef6; --muted:#9aa8bc; --accent:#66e5c5; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif; }
    button,a,input,textarea { -webkit-tap-highlight-color:transparent; }
    button:not(:disabled),summary,label { cursor:pointer; }
    button:disabled { cursor:not-allowed; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
    input[type=checkbox] { accent-color:var(--accent); width:20px; height:20px; flex-shrink:0; cursor:pointer; }
    input[type=checkbox]:disabled { cursor:not-allowed; }
    .panel { background:var(--panel); border:1px solid var(--line); }
    .muted { color:var(--muted); } .accent { color:var(--accent); }
    .road-card { scroll-margin-top:100px; }
    .dot-grid { background-image:radial-gradient(var(--line) 1px,transparent 1px); background-size:18px 18px; }
    .thin-scroll { scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
    .progress-fill { transition:width .35s ease; }
    #toast:empty { display:none; }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; } }
    @media print { header,aside,#toolbar,#toast,footer,.resource-link { display:none!important; } main { display:block!important; } .panel { break-inside:avoid; } }
  </style>
</head>

    if(!Number.isInteger(i)||!ROADMAP[i]||!isUnlocked(i))return;
    query='';expanded.add(ROADMAP[i].id);render();
    document.getElementById('section-'+ROADMAP[i].id)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});
    document.getElementById('toggle-'+ROADMAP[i].id)?.focus({preventScroll:true});
  }
  function bind() {
    document.getElementById('language').onclick=()=>{state.language=state.language==='ru'?'en':'ru';persist();render();};
    document.getElementById('theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';persist();render();};
    document.getElementById('resume').onclick=()=>navigate(currentIndex());
    document.getElementById('search').oninput=e=>{query=e.target.value;document.getElementById('cards').innerHTML=renderCards();bindCards();};
    document.querySelectorAll('[data-nav]').forEach(e=>e.onclick=()=>navigate(Number(e.dataset.nav)));
    document.getElementById('export').onclick=()=>{
      const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download='clean-godot-progress-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(t('exported'));
    };
    document.getElementById('import').onclick=()=>document.getElementById('import-file').click();
    document.getElementById('import-file').onchange=async e=>{
      const file=e.target.files[0];if(!file)return;
      try {
        if(file.size>2*1024*1024){toast(t('fileLarge'));return;}
        const next=validate(JSON.parse(await file.text()),true);
        if(!confirm(t('importAsk')))return;
        state=next;query='';expanded=new Set([ROADMAP[currentIndex()].id]);persist();render();toast(t('imported'));
      }catch(_){toast(t('invalid'));}finally{e.target.value='';}
    };
    document.getElementById('reset').onclick=()=>{
      if(!confirm(t('resetAsk')))return;
      state={...defaults(),language:state.language,theme:state.theme};query='';expanded=new Set([ROADMAP[0].id]);persist();render();toast(t('resetDone'));
    };
    bindCards();
  }
  function bindCards() {
    document.querySelectorAll('[data-toggle]').forEach(e=>e.onclick=()=>{
      const i=Number(e.dataset.toggle);if(!isUnlocked(i))return;
      const id=ROADMAP[i].id;expanded.has(id)?expanded.delete(id):expanded.add(id);render(true);
    });
    document.querySelectorAll('[data-topic]').forEach(e=>e.onchange=()=>{
      const i=Number(e.dataset.index);if(!isUnlocked(i)){render();return;}
      const before=isDone(i),id=e.dataset.topic;
      if(e.checked)state.checked[id]=true;else delete state.checked[id];
      const after=isDone(i);persist();render(true);
      if(after&&!before&&i<ROADMAP.length-1)toast(t('unlock')+': '+tr(ROADMAP[i+1].title));
      if(before&&!after&&i<ROADMAP.length-1)toast(t('relock'));
    });
    document.querySelectorAll('[data-practice]').forEach(e=>e.onchange=()=>{
      if(!isUnlocked(Number(e.dataset.index))){render();return;}
      if(e.checked)state.practice[e.dataset.practice]=true;else delete state.practice[e.dataset.practice];persist();render(true);
    });
    document.querySelectorAll('[data-notes]').forEach(e=>e.oninput=()=>{
      if(!isUnlocked(Number(e.dataset.index)))return;
      state.notes[e.dataset.notes]=e.value;persist();
    });
    document.querySelectorAll('[data-next]').forEach(e=>e.onclick=()=>navigate(Number(e.dataset.next)));
    document.querySelectorAll('[data-clear-search]').forEach(e=>e.onclick=()=>{query='';render();document.getElementById('search').focus();});
  }
  // Browser tabs sharing an origin also share localStorage. Last saved state wins.
  window.addEventListener('storage',e=>{
    if(e.key!==KEY||!e.newValue)return;
    try{state=validate(JSON.parse(e.newValue));render();}catch(_){}
  });
  render();
  </script>
</body>
</html>
