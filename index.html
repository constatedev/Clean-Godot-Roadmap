  function renderBranch(section){
    const i=ROADMAP.indexOf(section),open=expanded.has(section.id)||!!query.trim(),done=isDone(section),count=countSection(section);
    return`<section id="section-${section.id}" class="branch" aria-labelledby="label-${section.id}"><button id="toggle-${section.id}" data-toggle="${section.id}" class="section-node ${done?'completed':''}" aria-expanded="${open}" aria-controls="topics-${section.id}" title="${t(open?'collapse':'expand')}"><span class="section-number">${done?icon('check',14):String(i+1).padStart(2,'0')}</span><span class="section-label"><strong id="label-${section.id}">${esc(tr(section.title))}</strong><small>${count} / ${section.topics.length} ${t('topics')}</small></span><span class="expand-icon">${icon('chevron',14)}</span></button>
      <div id="topics-${section.id}" class="topic-tree" ${open?'':'hidden'}>${section.topics.map(topic=>`<div class="topic-node ${state.checked[topic.id]?'checked':''} ${query.trim()&&(topic.title.ru+' '+topic.title.en).toLowerCase().includes(query.trim().toLowerCase())?'search-match':''}"><input id="topic-${topic.id}" data-topic="${topic.id}" type="checkbox" ${state.checked[topic.id]?'checked':''}><label for="topic-${topic.id}">${esc(tr(topic.title))}</label><a class="resource-link" href="${esc(topic.url)}" target="_blank" rel="noopener noreferrer" title="${esc(t('docs')+' — '+tr(topic.title))}" aria-label="${esc(t('docs')+' — '+tr(topic.title))}">${icon('link',15)}</a></div>`).join('')}
      <details id="details-${section.id}" data-details="${section.id}" class="section-details" ${detailsOpen.has(section.id)?'open':''}><summary>${icon('chevron',12)}${t('details')}</summary><p class="goal">${esc(tr(section.goal))}</p><div class="practice-box"><div class="practice-title"><strong>${t('exercise')}</strong><span>${t('optional')}</span></div><p>${esc(tr(section.task))}</p><label class="practice-check"><input id="practice-${section.id}" data-practice="${section.id}" type="checkbox" ${state.practice[section.id]?'checked':''}>${t('taskDone')}</label></div><label for="notes-${section.id}" class="note-label">${t('notes')}</label><textarea id="notes-${section.id}" data-notes="${section.id}" class="notes" maxlength="6000" rows="2" placeholder="${t('notesHint')}">${esc(state.notes[section.id]||'')}</textarea>${section.extra?`<p class="additional">${t('sources')}: <a href="${esc(section.extra[1])}" target="_blank" rel="noopener noreferrer">${esc(section.extra[0])}</a></p>`:''}</details></div></section>`;
  }
  function redrawTree(){const focused=document.activeElement?.id;$('roadmap').innerHTML=renderTree();updateExpandButton();bindTree();if(focused)$(focused)?.focus({preventScroll:true});}
  function goToPhase(p){if(!PHASES[p])return;if(query){query='';$('search').value='';redrawTree();}$('phase-'+p)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});const section=ROADMAP.find(s=>s.phase===p);$('toggle-'+section.id)?.focus({preventScroll:true});}
  function bind(){
    $('language').onclick=()=>{state.language=state.language==='ru'?'en':'ru';persist();render(true);};
    $('theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';persist();render(true);};
    $('search').oninput=e=>{query=e.target.value;redrawTree();};
    $('expand-all').onclick=()=>{const visible=visibleSections(),all=visible.length>0&&visible.every(s=>expanded.has(s.id));visible.forEach(s=>all?expanded.delete(s.id):expanded.add(s.id));if(query){query='';$('search').value='';}redrawTree();};
    document.querySelectorAll('[data-phase]').forEach(e=>e.onclick=()=>goToPhase(Number(e.dataset.phase)));
    $('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='clean-godot-progress-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(t('exported'));};
    $('import').onclick=()=>$('import-file').click();
    $('import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2*1024*1024){toast(t('fileLarge'));return;}const next=validate(JSON.parse(await file.text()),true);if(!confirm(t('importAsk')))return;state=next;query='';persist();render();toast(t('imported'));}catch(_){toast(t('invalid'));}finally{e.target.value='';}};
    $('reset').onclick=()=>{if(!confirm(t('resetAsk')))return;state={...defaults(),language:state.language,theme:state.theme};persist();render(true);toast(t('resetDone'));};
    bindTree();
  }
  function bindTree(){
    document.querySelectorAll('[data-toggle]').forEach(e=>e.onclick=()=>{const id=e.dataset.toggle;if(!sectionIds.has(id))return;const open=e.getAttribute('aria-expanded')!=='true';if(open)expanded.add(id);else expanded.delete(id);$('topics-'+id).hidden=!open;e.setAttribute('aria-expanded',String(open));e.title=t(open?'collapse':'expand');updateExpandButton();});
    document.querySelectorAll('[data-topic]').forEach(e=>e.onchange=()=>{const id=e.dataset.topic;if(!topicIds.has(id))return;if(e.checked)state.checked[id]=true;else delete state.checked[id];persist();render(true);});
    document.querySelectorAll('[data-practice]').forEach(e=>e.onchange=()=>{const id=e.dataset.practice;if(!sectionIds.has(id))return;if(e.checked)state.practice[id]=true;else delete state.practice[id];persist();});
    document.querySelectorAll('[data-notes]').forEach(e=>e.oninput=()=>{if(!sectionIds.has(e.dataset.notes))return;state.notes[e.dataset.notes]=e.value;persist();});
    document.querySelectorAll('[data-details]').forEach(e=>e.ontoggle=()=>{if(!e.isConnected)return;e.open?detailsOpen.add(e.dataset.details):detailsOpen.delete(e.dataset.details);});
    if($('clear-search'))$('clear-search').onclick=()=>{query='';$('search').value='';redrawTree();$('search').focus();};
  }
  window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{state=validate(JSON.parse(e.newValue));render();}catch(_){}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('settings'))$('settings').open=false;});
  render();
  </script>
</body>
</html>
